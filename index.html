@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ld{to{width:100%}}
@media(max-width:900px){

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid #ffb84d;outline-offset:2px}

const M=[];G.forEach(g=>g.m.forEach(a=>M.push({id:a[0],t:a[1],p:a[2],b:a[3],d:a[4],s:!!a[5],g:g.g})));

/* ===== daftar materi ===== */
function renderList(f=""){
 const q=f.trim().toLowerCase();let h="",n=0;
 G.forEach(g=>{const it=g.m.filter(a=>!q||(a[1]+" "+a[4]+" "+g.g).toLowerCase().includes(q));
  if(!it.length)return;n+=it.length;h+=`<h2 class="gt">${g.g}</h2>`+it.map(a=>`<button class="mi${a[5]?" sub":""}${M[cur].id===a[0]?" on":""}" data-id="${a[0]}"><i></i>${a[1]}</button>`).join("")});
 $("#list").innerHTML=n?h:'<div class="empty">Materi tidak ditemukan.</div>';
}
/* ===== viewer ===== */
function vs(){return[vp.clientWidth,vp.clientHeight]}
function minS(){const[w,h]=vs();return Math.min(w/W,h/H)*.5}
function clamp(){const[w,h]=vs();V.s=Math.min(6,Math.max(minS(),V.s));const m=60;
 V.x=Math.min(w-m,Math.max(m-W*V.s,V.x));V.y=Math.min(h-m,Math.max(m-H*V.s,V.y))}
function apply(anim){st.style.transition=anim?"transform .6s cubic-bezier(.2,.8,.2,1)":"none";clamp();st.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.s})`;blurUpdate(anim);schedTiles()}
/* blur di luar materi terpilih: lubang (clip-path) mengikuti kotak materi */
function blurUpdate(anim){
 const el=document.getElementById("blr"),b=M[cur].b,full=b[2]-b[0]>=1900,p=8,[w,h]=vs();
 const x1=V.x+(b[0]-p)*V.s,y1=V.y+(b[1]-p)*V.s,x2=V.x+(b[2]+p)*V.s,y2=V.y+(b[3]+p)*V.s;
 const r=Math.max(0,Math.min(22*V.s,(x2-x1)/2,(y2-y1)/2));
 const f=n=>n.toFixed(2);
 /* seluruh layar dikurangi persegi rounded (evenodd) -> blur hanya di luar materi, sudut bulat */
 const d=`M0 0H${f(w)}V${f(h)}H0Z M${f(x1+r)} ${f(y1)}H${f(x2-r)}A${f(r)} ${f(r)} 0 0 1 ${f(x2)} ${f(y1+r)}V${f(y2-r)}A${f(r)} ${f(r)} 0 0 1 ${f(x2-r)} ${f(y2)}H${f(x1+r)}A${f(r)} ${f(r)} 0 0 1 ${f(x1)} ${f(y2-r)}V${f(y1+r)}A${f(r)} ${f(r)} 0 0 1 ${f(x1+r)} ${f(y1)}Z`;
 el.style.transition=anim?"clip-path .6s cubic-bezier(.2,.8,.2,1),-webkit-clip-path .6s cubic-bezier(.2,.8,.2,1),opacity .3s":"opacity .3s";
 el.style.opacity=showHL&&!full?1:0;
 el.style.clipPath=el.style.webkitClipPath=`path(evenodd,"${d}")`;
}
function setPage(p){if(page===p)return;page=p;$('#tl1').classList.toggle('on',p===1);$('#tl2').classList.toggle('on',p===2);$("#i1").classList.toggle("on",p===1);$("#i2").classList.toggle("on",p===2);$("#pg").textContent=`Halaman ${p} dari 2`}
function fitBox(b,anim=true,pad=.05){
 const[w,h]=vs(),bw=b[2]-b[0],bh=b[3]-b[1];
 V.s=Math.min(w/(bw*(1+2*pad)),h/(bh*(1+2*pad)));
 V.x=w/2-(b[0]+bw/2)*V.s;V.y=h/2-(b[1]+bh/2)*V.s;apply(anim);
}
function mark(m){
 const b=m.b,full=b[2]-b[0]>=1900;hl.classList.toggle("show",showHL&&!full);
 Object.assign(hl.style,{left:b[0]-8+"px",top:b[1]-8+"px",width:b[2]-b[0]+16+"px",height:b[3]-b[1]+16+"px"});
}
function go(i,anim=true){
 cur=(i+M.length)%M.length;const m=M[cur],ch=page!==m.p;

 $("#ttl").textContent=m.t;$("#eyb").textContent=m.g;document.title=m.t+" — Lembar Tajwid Tartili";$("#dsc").textContent=m.d||"";

function zoomAt(f,cx,cy,anim){const ns=Math.min(6,Math.max(minS(),V.s*f));f=ns/V.s;V.x=cx-(cx-V.x)*f;V.y=cy-(cy-V.y)*f;V.s=ns;apply(anim)}
function center(){const[w,h]=vs();return[w/2,h/2]}
/* pointer: geser & cubit */
const P=new Map();let pd=0;
vp.addEventListener("pointerdown",e=>{vp.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);vp.classList.add("drag");hideHint();
 if(P.size===2){const[a,b]=[...P.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
vp.addEventListener("pointermove",e=>{
 if(!P.has(e.pointerId))return;const o=P.get(e.pointerId),r=vp.getBoundingClientRect();
 if(P.size===1){V.x+=e.clientX-o[0];V.y+=e.clientY-o[1];P.set(e.pointerId,[e.clientX,e.clientY]);apply(false)}
 else if(P.size===2){P.set(e.pointerId,[e.clientX,e.clientY]);const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
  if(pd){zoomAt(d/pd,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,false)}pd=d}});
const up=e=>{P.delete(e.pointerId);if(!P.size)vp.classList.remove("drag");pd=0;if(P.size===1){const k=[...P.keys()][0];}};
vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
vp.addEventListener("wheel",e=>{e.preventDefault();hideHint();const r=vp.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)),e.clientX-r.left,e.clientY-r.top,false)},{passive:false});
vp.addEventListener("dblclick",e=>{const r=vp.getBoundingClientRect();zoomAt(V.s>fitS()*1.9?.5:2,e.clientX-r.left,e.clientY-r.top,true)});
function fitS(){const b=M[cur].b,[w,h]=vs();return Math.min(w/((b[2]-b[0])*1.1),h/((b[3]-b[1])*1.1))}
vp.addEventListener("keydown",e=>{const k=e.key,st=60;
 if(k==="ArrowLeft"){V.x+=st}else if(k==="ArrowRight"){V.x-=st}else if(k==="ArrowUp"){V.y+=st}else if(k==="ArrowDown"){V.y-=st}
 else if(k==="+"||k==="="){const[c,d]=center();zoomAt(1.25,c,d,true);return}else if(k==="-"){const[c,d]=center();zoomAt(.8,c,d,true);return}
 else if(k==="0"){fitBox(M[cur].b);return}else if(k==="PageDown"){go(cur+1)}else if(k==="PageUp"){go(cur-1)}else return;
 e.preventDefault();apply(false)});

/* ===== tile bertingkat: hanya potongan yang terlihat yang dimuat ===== */
const TS=512,LV={1:{f:2,w:3900,h:2484},2:{f:4,w:7800,h:4967},3:{f:8,w:15600,h:9934}};
const TM=new Map();let tq=0;
function schedTiles(){if(tq)return;tq=requestAnimationFrame(()=>{tq=0;tileUpdate()})}
function tileUpdate(){
 const[w,h]=vs(),need=V.s*Math.min(devicePixelRatio||1,2),L=need>4.6?3:need>2.3?2:need>1.15?1:0;
 const mx=(w/V.s)*.2,my=(h/V.s)*.2,x1=-V.x/V.s-mx,y1=-V.y/V.s-my,x2=(w-V.x)/V.s+mx,y2=(h-V.y)/V.s+my;
 for(const[k,t]of TM){if(t.p!==page||t.L>L||t.r[2]<x1||t.r[0]>x2||t.r[3]<y1||t.r[1]>y2){t.el.remove();TM.delete(k)}}
 if(!L)return;
 const{f,w:LW,h:LH}=LV[L],ts=TS/f,cont=$("#tl"+page);
 const ax=Math.max(0,Math.floor(x1/ts)),bx=Math.min(Math.ceil(LW/TS)-1,Math.floor(x2/ts)),ay=Math.max(0,Math.floor(y1/ts)),by=Math.min(Math.ceil(LH/TS)-1,Math.floor(y2/ts));
 for(let y=ay;y<=by;y++)for(let x=ax;x<=bx;x++){
  const key=`${page}/${L}/${x}_${y}`;if(TM.has(key))continue;
  const tw=Math.min(TS,LW-x*TS),th=Math.min(TS,LH-y*TS),ex=x*TS+tw<LW?1:0,ey=y*TS+th<LH?1:0,el=new Image();
  const r=[x*ts,y*ts,(x*TS+tw)/f,(y*TS+th)/f];
  el.className="tl";el.decoding="async";el.alt="";el.draggable=false;
  Object.assign(el.style,{left:r[0]+"px",top:r[1]+"px",width:(tw+ex)/f+"px",height:(th+ey)/f+"px",zIndex:L});
  el.onload=()=>el.classList.add("ok");el.src=`t/${page}/${L}/${x}_${y}.webp`;
  cont.appendChild(el);TM.set(key,{el,p:page,L,r});
 }
}

const TC="tajwid-tiles-v3";let toastT;

function allTiles(){const a=[];for(const p of[1,2])for(const L of[1,2,3]){const{w,h}=LV[L];for(let y=0;y<Math.ceil(h/TS);y++)for(let x=0;x<Math.ceil(w/TS);x++)a.push(`t/${p}/${L}/${x}_${y}.webp`)}return a}
function offState(){let ok=false;try{ok=localStorage.offAll==="1"}catch(e){}$("#offs").textContent=ok?"Siap dipakai offline ✓":"";$("#off").textContent=ok?"☁ Offline siap ✓":"☁ Simpan Offline"}
$("#off").onclick=async()=>{
 if(!("caches" in window)||!/^https?:/.test(location.protocol)){toast("Mode offline aktif setelah aplikasi dibuka lewat alamat web (https://).");return}
 const btn=$("#off"),st=$("#offs"),list=allTiles();let n=0,fail=0;btn.disabled=true;
 try{const c=await caches.open(TC);
  const work=async()=>{while(list.length){const u=list.pop();try{if(!(await c.match(u))){const r=await fetch(u);if(r.ok)await c.put(u,r);else fail++}}catch(e){fail++}n++;if(n%12===0)st.textContent=`Menyimpan… ${Math.round(n/tot*100)}%`}};
  const tot=list.length;await Promise.all(Array.from({length:6},work));
  if(fail){st.textContent=`Selesai, ${fail} potongan gagal — coba lagi.`;toast("Sebagian gagal disimpan. Periksa koneksi lalu coba lagi.")}
  else{try{localStorage.offAll="1"}catch(e){}offState();toast("Selesai! Aplikasi bisa dipakai tanpa internet.")}
 }catch(e){st.textContent="Gagal menyimpan.";toast("Gagal menyimpan offline.")}
 btn.disabled=false};
offState();
