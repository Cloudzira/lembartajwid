<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7461cf">
<title>Lembar Tajwid Tartili</title>
<style>
:root{--p:#7461cf;--pd:#4b3aa8;--bg:#f2effc;--ink:#2a2347;--mut:#6c6788;--card:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 14px}
header h1{font-size:clamp(20px,4vw,28px);font-weight:700}
header p{font-size:13px;opacity:.9;margin-top:2px}
nav{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 4px 14px rgba(70,50,170,.12);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--pd);background:#efeaff;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;min-height:40px;display:flex;align-items:center}
nav a.on{background:var(--p);color:#fff}
main{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
.intro{color:var(--mut);font-size:14px;line-height:1.6;margin-bottom:16px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
.card{background:var(--card);border-radius:20px;box-shadow:0 8px 24px rgba(94,74,200,.12);overflow:hidden}
.card.wide{grid-column:1/-1}
.card h3{font-size:16px;padding:14px 16px 2px}
.card p{font-size:13px;color:var(--mut);padding:0 16px 10px;line-height:1.5}
.card button.im{display:block;width:100%;border:0;background:#fff;padding:0 10px 12px;cursor:zoom-in}
.card img{display:block;width:100%;height:auto;border-radius:12px;margin:0 auto}
.card.narrow img{max-width:520px}
.hint{font-size:12px;color:var(--p);padding:0 16px 14px;font-weight:600}
.dl{display:inline-block;margin:6px 8px 0 0;background:var(--p);color:#fff;text-decoration:none;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px}
#lb{position:fixed;inset:0;background:rgba(20,15,45,.94);z-index:50;display:none;flex-direction:column}
#lb.show{display:flex}
#bar{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#fff}
#bar span{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button,#bar a{border:0;background:#ffffff26;color:#fff;min-width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;text-decoration:none;display:grid;place-items:center}
#sc{flex:1;overflow:auto;padding:0 8px calc(14px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#big{display:block;margin:0 auto;max-width:none;background:#fff;border-radius:8px}
@media(min-width:900px){main{padding-top:26px}.card h3{font-size:18px}}
</style>
</head>
<body>
<header><h1>Lembar Tajwid Tartili</h1><p>Disusun ulang oleh Unit Pendidikan Alquran Masjid Fatimatuzzahra Purwokerto</p></header>
<nav id="nav" aria-label="Materi"></nav>
<main id="view"></main>
<div id="lb" role="dialog" aria-modal="true" aria-label="Gambar diperbesar">
 <div id="bar"><span id="lt"></span><button id="zm" aria-label="Perkecil">−</button><button id="zp" aria-label="Perbesar">+</button><a id="dw" download aria-label="Unduh gambar">⤓</a><button id="cl" aria-label="Tutup">✕</button></div>
 <div id="sc"><img id="big" alt=""></div>
</div>
<script>
const S=[
{k:"mad",t:"Mad",i:"Mad Pokok (2 harokat) dan Mad Cabang (lebih dari 2 harokat) beserta sebab-sebabnya.",c:[
 ["mad-bagan","Bagan Mad Lengkap","Gambaran seluruh hukum mad.",1],
 ["mad-ashli","Mad Ashli (Pokok)","Mad Thabi'i, 'Iwadh, Harfi, dan Shilah Shughra."],
 ["mad-hamzah","Mad Far'i — Sebab Bertemu Hamzah","Wajib Muttashil, Jaiz Munfashil, Shilah Kubra, dan Badal."],
 ["mad-lazim","Mad Lazim","Mad bertemu sukun asli, panjang 6 harokat."],
 ["mad-aridh-liyn","Mad 'Aridh Lissukun dan Mad Liyn","Panjang 2/4/6 harokat.",0,1]]},
{k:"makhraj",t:"Makhraj",i:"Nama dan tempat keluar huruf-huruf.",c:[["makhraj","Nama dan Tempat Keluar Huruf-Huruf","",0,1]]},
{k:"sifat",t:"Sifat Huruf",i:"Sifat-sifat huruf yang mempunyai lawan dan yang tidak punya lawan.",c:[
 ["sifat-lawan","Sifat-Sifat yang Mempunyai Lawan","",0,1],
 ["sifat-tanpa-lawan","Sifat-Sifat yang Tak Punya Lawan (lanjutan)","Shafir, Inhiraf, Liyn, Takrir, Tafasysyi, Istithalah.",1],
 ["sifat-halaman","Lembar Sifat Huruf (lengkap)","",0,1]]},
{k:"qalqalah",t:"Qalqalah",i:"Huruf qalqalah ada 5: ب ج د ط ق.",c:[
 ["qalqalah-kecil","Qalqalah Shughra (kecil)","Memantul sedikit pada sukun asli di tengah dan akhir kata."],
 ["qalqalah-sedang","Qalqalah Wustha (sedang)","Pada akhir kata yang dibaca sukun karena waqof."],
 ["qalqalah-besar","Qalqalah Kubra (besar)","Akhir kata bertasydid, ditekan satu harokat lalu memantul."]]},
{k:"nun",t:"Nun & Mim",i:"Hukum nun sukun dan tanwin, mim sukun, serta nun dan mim bertasydid.",c:[
 ["nunmim","Hukum Nun Sukun dan Tanwin, Mim Sukun, serta Nun dan Mim Bertasydid","",1],
 ["dengung","Catatan Dengung","Dengung 1 harokat; yang bergaris merah dengung 2 harokat.",0,1],
 ["nun","Hukum Nun Sukun dan Tanwin","Izhhar, Idgham, Iqlab, dan Ikhfa'."],
 ["mim","Hukum Mim Sukun","Ikhfa' Syafawi, Idgham Mimi, dan Izhhar Syafawi.",0,1],
 ["bertasydid","Hukum Nun dan Mim Bertasydid","Ghunnah.",0,1]]},
{k:"waqaf",t:"Waqaf",i:"Tanda-tanda waqaf dan cara menyikapinya.",c:[["waqaf","Tanda-Tanda Waqaf","",1]]},
{k:"lembar",t:"Lembar Lengkap",i:"Dua halaman asli lembar tajwid.",c:[
 ["halaman-1","Halaman 1 — Mad dan Makhraj","",1],["halaman-2","Halaman 2 — Sifat, Qalqalah, Nun/Mim, Waqaf","",1]],pdf:1}];
const $=s=>document.querySelector(s);
const nav=cur=>$("#nav").innerHTML=S.map(s=>`<a href="#${s.k}"${s.k===cur?' class="on" aria-current="page"':""}>${s.t}</a>`).join("");
function route(){
 const k=location.hash.slice(1),s=S.find(x=>x.k===k)||S[0];
 nav(s.k);
 $("#view").innerHTML=`<p class="intro">${s.i}</p><div class="grid">`+s.c.map(([f,t,d,w,n])=>`<article class="card${w?" wide":""}${n?" narrow":""}"><h3>${t}</h3>${d?`<p>${d}</p>`:""}<button class="im" data-f="${f}" data-t="${t.replace(/"/g,"&quot;")}" aria-label="Perbesar: ${t.replace(/"/g,"&quot;")}"><img src="img/${f}.jpg" alt="${t.replace(/"/g,"&quot;")}" loading="lazy"></button><div class="hint">Ketuk gambar untuk memperbesar</div></article>`).join("")+`</div>`+(s.pdf?`<p style="margin-top:18px"><a class="dl" href="lembar_tajwid.pdf" download>Unduh PDF asli</a></p>`:"");
 scrollTo(0,0);
 const a=$("#nav a.on");a&&a.scrollIntoView({inline:"center",block:"nearest"});
}
let Z=1;
const zoom=v=>{Z=Math.min(4,Math.max(.5,v));const sc=$("#sc");$("#big").style.width=(sc.clientWidth-16)*Z+"px"};
function open(f,t){
 const b=$("#big");b.src=`img/${f}.jpg`;b.alt=t;$("#lt").textContent=t;$("#dw").href=b.src;$("#dw").download=f+".jpg";
 $("#lb").classList.add("show");document.body.style.overflow="hidden";
 Z=innerWidth<700?(f.startsWith("halaman")||f==="makhraj"?2.2:1.4):1;requestAnimationFrame(()=>{zoom(Z);$("#sc").scrollTo(0,0)});
}
function close(){$("#lb").classList.remove("show");document.body.style.overflow=""}
$("#view").addEventListener("click",e=>{const b=e.target.closest("button.im");if(b)open(b.dataset.f,b.dataset.t)});
$("#zp").onclick=()=>zoom(Z*1.3);$("#zm").onclick=()=>zoom(Z/1.3);$("#cl").onclick=close;
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb"||e.target.id==="sc")close()});
addEventListener("keydown",e=>{if(e.key==="Escape")close();if(e.key==="+")zoom(Z*1.3);if(e.key==="-")zoom(Z/1.3)});
addEventListener("hashchange",()=>{close();route()});
addEventListener("resize",()=>$("#lb").classList.contains("show")&&zoom(Z));
route();
</script>
</body>
</html>
