const ORDER=["mad","sifat","makhraj","nun","mim","waqaf"];
const HOME={t:"Beranda",i:"fa-house"};
const $=s=>document.querySelector(s);
const cnt=k=>D[k].g.reduce((a,g)=>a+g.items.length,0);

/* ================= RENDER ================= */
const R=s=>s.replace(/\*(.+?)\*/g,'<em class="rd">$1</em>').replace(/\(([^)]*)\)/g,'<small class="lat">($1)</small>');
const L=s=>s.replace(/[\u0600-\u06FF][\u0600-\u06FF\s]*[\u0600-\u06FF]/g,'<span class="ar" lang="ar">$&</span>');
const N=s=>s.replace(/\*/g,"").normalize("NFKD").replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").toLowerCase();
const A=(c,t)=>`<div class="ar ${c}" lang="ar">${R(t)}</div>`;
const card=(it,k)=>`<article class="card${k==="mad"?" red":k==="waqaf"?" sg":""}"><div class="top"><div><h3>${it.n}</h3>${it.b?`<span class="bd">${it.b}</span>`:""}</div>${it.a?A("big",it.a):""}</div>${it.d?`<p>${it.d}</p>`:""}${it.l?A("lt",it.l):""}${it.r?`<ul class="rows">${it.r.map(r=>`<li><span class="ar" lang="ar">${R(r[0])}</span><span>${r[1]}</span></li>`).join("")}</ul>`:""}${it.x?`<div class="ex">${it.x.map(e=>`<span class="ar" lang="ar">${R(e)}</span>`).join("")}</div>`:""}</article>`;
const group=(g,k)=>`<div class="gh"><h2>${g.h}</h2>${g.ar?`<span class="ar" lang="ar">${g.ar}</span>`:""}${g.n?`<span class="tag">${L(g.n)}</span>`:""}</div><div class="grid">${g.items.map(i=>card(i,k)).join("")}</div>`;

function home(){
 const q=[["s1","fa-wave-square","mad","Hukum Mad"],["s2","fa-sliders","sifat","Sifat Huruf"],["s3","fa-microphone-lines","makhraj","Kelompok Makhraj"],["s4","fa-hand","waqaf","Tanda Waqaf"]];
 return `<section class="hero"><div><h2>Assalamu'alaikum! 👋</h2><p>Lembar Tajwid Tartili dalam satu aplikasi: mad, sifat huruf, makhraj, nun sukun &amp; tanwin, mim sukun, dan tanda waqaf — lengkap dengan teks Arab dan penjelasannya.</p><a class="btn" href="#mad"><i class="fa-solid fa-book-open"></i> Mulai Belajar</a></div><div class="art">تَجْوِيدٌ</div></section>
 <div class="stats">${q.map(([c,i,k,l])=>`<a class="st ${c}" href="#${k}"><div class="ic"><i class="fa-solid ${i}"></i></div><b>${cnt(k)}</b><span>${l}</span></a>`).join("")}</div>
 <div class="gh"><h2>Materi</h2></div><div class="grid">${ORDER.map(k=>`<a class="card" href="#${k}"><div class="top"><div><h3>${D[k].t}</h3></div><i class="fa-solid ${D[k].i}" style="color:var(--p);font-size:20px"></i></div><p>${L(D[k].s)}</p></a>`).join("")}</div>`;
}

function section(k){const s=D[k];return `<p class="lead">${L(s.s)}</p>${s.note?`<div class="note">${s.note}</div>`:""}${s.g.map(g=>group(g,k)).join("")}`}

function search(v){
 const t=N(v.trim()),hit=[];
 ORDER.forEach(k=>D[k].g.forEach(g=>g.items.forEach(it=>{
  if(N([it.n,it.a,it.b,it.d,it.l,...(it.x||[]),...(it.r||[]).flat(),g.h].filter(Boolean).join(" ")).includes(t))hit.push([it,k]);
 })));
 const e=v.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
 return hit.length?`<div class="gh"><h2>${hit.length} hasil untuk “${e}”</h2></div><div class="grid">${hit.map(h=>card(...h)).join("")}</div>`:`<div class="empty"><i class="fa-regular fa-face-frown" style="font-size:30px"></i><p>Tidak ada hasil untuk “${e}”. Coba kata lain, misalnya “ikhfa”, “mad”, atau huruf Arab.</p></div>`;
}

const SH={home:"Beranda",mad:"Mad",sifat:"Sifat",makhraj:"Makhraj",nun:"Nun",mim:"Mim",waqaf:"Waqaf"};
function nav(cur){
 const l=[["home",HOME],...ORDER.map(k=>[k,D[k]])];
 const h=f=>l.map(([k,s])=>`<a href="#${k==="home"?"":k}"${k===cur?' class="on" aria-current="page"':""}><i class="fa-solid ${s.i}"></i>${f?SH[k]:k==="home"?"Beranda":s.t}</a>`).join("");
 $("#nav").innerHTML=h(0);$("#dock").innerHTML=h(1);
}

function route(){
 const k=location.hash.slice(1),cur=D[k]?k:"home",v=$("#q").value.trim();
 nav(cur);
 $("#ttl").textContent=v?"Hasil Pencarian":cur==="home"?"Beranda":D[cur].t;
 $("#view").innerHTML=v?search(v):cur==="home"?home():section(cur);
 if(!v)scrollTo({top:0});
}
$("#q").addEventListener("input",route);
addEventListener("hashchange",()=>{$("#q").value="";route()});
document.addEventListener("click",e=>{if(e.target.closest('a[href^="#"]')&&$("#q").value){$("#q").value="";route()}});

/* ukuran huruf Arab */
let AZ=1;try{AZ=+localStorage.az||1}catch(e){}
const setAZ=v=>{AZ=Math.min(1.5,Math.max(.8,Math.round(v*100)/100));document.documentElement.style.setProperty("--az",AZ);try{localStorage.az=AZ}catch(e){}};
setAZ(AZ);
$("#azm").onclick=()=>setAZ(AZ-.1);$("#azp").onclick=()=>setAZ(AZ+.1);
const up=$("#up");up.onclick=()=>scrollTo({top:0,behavior:"smooth"});
addEventListener("scroll",()=>up.classList.toggle("show",scrollY>500),{passive:true});
route();
</script>
</body>
</html>
