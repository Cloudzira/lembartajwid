<style>
:root{--p:#7461cf;--p2:#a595ec;--ink:#2b2750;--mut:#7b779c;--line:#ece6fb;--rd:#d62f4a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(160deg,#ddd5f8,#b7a8ee);padding:18px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{display:grid;grid-template-columns:310px 1fr;gap:18px;max-width:1700px;margin:0 auto;height:calc(100dvh - 36px)}
.side{background:linear-gradient(180deg,#8d7ede,#6c5bc7);border-radius:30px;padding:20px 12px 14px;color:#fff;display:flex;flex-direction:column;min-height:0;box-shadow:0 18px 40px rgba(94,76,190,.35)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 14px}
.logo{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;background:linear-gradient(135deg,#9c8df0,#6d5cc8);border:3px solid rgba(255,255,255,.55);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.brand b{display:block;font-size:15px;line-height:1.25}.brand span{font-size:11px;opacity:.85}
.sr{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;margin:0 6px 10px;box-shadow:inset 0 2px 6px rgba(120,100,200,.12)}
.sr input{border:0;outline:0;background:none;font:inherit;font-size:13px;width:100%;color:var(--ink)}
#list{flex:1;overflow-y:auto;padding:0 4px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#ffffff66 transparent}
.gt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8;padding:12px 12px 6px}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;border-radius:14px;font-size:13.5px;font-weight:500;color:#efeaff;transition:.2s;min-height:42px}
.mi:hover{background:rgba(255,255,255,.14)}
.mi.on{background:#fff;color:var(--p);box-shadow:0 8px 18px rgba(0,0,0,.15);font-weight:600}
.mi i{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55}
.mi.sub{padding-left:26px;font-size:13px}
.empty{padding:20px;text-align:center;font-size:13px;opacity:.85}
.side small{display:block;text-align:center;opacity:.8;font-size:11px;line-height:1.5;padding-top:10px}
.side small a{text-decoration:underline;color:#fff}
.main{background:rgba(255,255,255,.58);border-radius:32px;padding:20px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px rgba(110,90,200,.18)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tt{flex:1;min-width:180px}
.tt h1{margin:0;font-size:22px;font-weight:700;line-height:1.25}
.tt p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tb{min-width:44px;height:44px;padding:0 14px;border-radius:14px;background:#fff;color:var(--p);font-weight:600;font-size:15px;box-shadow:0 4px 10px rgba(110,90,200,.15);transition:.15s}
.tb:hover{background:#f3efff}.tb:active{transform:scale(.95)}.tb.on{background:var(--p);color:#fff}
.tb.pr{background:linear-gradient(135deg,#8f7fe6,#6d5bcb);color:#fff}
.vwrap{position:relative;flex:1;min-height:0;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 1px var(--line),0 10px 24px rgba(110,90,200,.12);overflow:hidden}
#vp{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden;background:repeating-conic-gradient(#f6f3ff 0 25%,#fff 0 50%) 0 0/24px 24px;user-select:none;-webkit-user-select:none}
#vp.drag{cursor:grabbing}
#st{position:absolute;left:0;top:0;width:1950px;height:1242px;transform-origin:0 0;will-change:transform}
#st img{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none;-webkit-user-drag:none;image-rendering:auto}
#st img.on{display:block;animation:fi .35s}
@keyframes fi{from{opacity:.2}to{opacity:1}}
#hl{position:absolute;border:6px dashed var(--p);border-radius:14px;box-shadow:0 0 0 4000px rgba(40,30,90,.18);pointer-events:none;display:none;transition:.4s}
#hl.show{display:block}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(43,39,80,.86);color:#fff;font-size:12px;padding:8px 14px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#pg{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92);color:var(--p);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;box-shadow:0 4px 10px rgba(110,90,200,.2);pointer-events:none}
.ft{font-size:11.5px;color:var(--mut);text-align:center}.ft a{color:inherit;font-weight:600}
.dock,#bd{display:none}
@media(max-width:900px){
 body{padding:8px 8px 0}
 .app{display:block;height:calc(100dvh - 8px)}
 .main{height:calc(100dvh - 8px - 72px - env(safe-area-inset-bottom));padding:12px;border-radius:24px;gap:8px}
 .tt h1{font-size:17px}.tt p{display:none}
 .bar{gap:6px}.tools{width:100%;flex-wrap:nowrap;gap:5px}.tools .tb{flex:1;min-width:0;padding:0 2px;font-size:13px;height:42px}#prv,#nxt{display:none}#hint{font-size:11px}
 .ft{display:none}
 .side{position:fixed;left:8px;right:8px;bottom:0;height:76dvh;z-index:40;border-radius:28px 28px 0 0;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
 .side.open{transform:none}
 #bd{position:fixed;inset:0;background:rgba(30,20,70,.45);z-index:30}
 #bd.show{display:block}
 .dock{display:flex;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:20;gap:8px;align-items:center;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:22px;padding:8px;box-shadow:0 10px 30px rgba(80,60,180,.3);height:60px}
 .dock .tb{flex:none;width:48px;height:44px;padding:0;min-width:0}
 .dock .pick{flex:1;min-width:0;height:44px;border-radius:14px;background:linear-gradient(135deg,#8f7fe6,#6d5bcb);color:#fff;font-weight:600;font-size:13px;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .vwrap{border-radius:18px}
}
@media(max-width:900px) and (orientation:landscape){.app{display:grid;grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid #ffb84d;outline-offset:2px}
</style>

{g:"Qalqalah",m:[

 ["q1","Qalqalah Shughra (kecil)",2,[630,225,920,510],"Sukun asli di tengah/akhir kata.",1],
 ["q2","Qalqalah Wustha (sedang)",2,[630,510,920,800],"Akhir kata, sukun karena waqof.",1],

{g:"Nun Sukun, Tanwin & Mim",m:[

const M=[];G.forEach(g=>g.m.forEach(a=>M.push({id:a[0],t:a[1],p:a[2],b:a[3],d:a[4],s:!!a[5]})));
const W=1950,H=1242,$=s=>document.querySelector(s);
const vp=$("#vp"),st=$("#st"),hl=$("#hl");
let cur=0,page=0,V={x:0,y:0,s:1},showHL=true;

/* ===== daftar materi ===== */
function renderList(f=""){
 const q=f.trim().toLowerCase();let h="",n=0;
 G.forEach(g=>{const it=g.m.filter(a=>!q||(a[1]+" "+a[4]+" "+g.g).toLowerCase().includes(q));
  if(!it.length)return;n+=it.length;h+=`<div class="gt">${g.g}</div>`+it.map(a=>`<button class="mi${a[5]?" sub":""}${M[cur].id===a[0]?" on":""}" data-id="${a[0]}"><i></i>${a[1]}</button>`).join("")});
 $("#list").innerHTML=n?h:'<div class="empty">Materi tidak ditemukan.</div>';
}
/* ===== viewer ===== */
function vs(){return[vp.clientWidth,vp.clientHeight]}
function minS(){const[w,h]=vs();return Math.min(w/W,h/H)*.5}
function clamp(){const[w,h]=vs();V.s=Math.min(6,Math.max(minS(),V.s));const m=60;
 V.x=Math.min(w-m,Math.max(m-W*V.s,V.x));V.y=Math.min(h-m,Math.max(m-H*V.s,V.y))}
function apply(anim){st.style.transition=anim?"transform .6s cubic-bezier(.2,.8,.2,1)":"none";clamp();st.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.s})`}
function setPage(p){if(page===p)return;page=p;$("#i1").classList.toggle("on",p===1);$("#i2").classList.toggle("on",p===2);$("#pg").textContent=`Halaman ${p} dari 2`}
function fitBox(b,anim=true,pad=.05){
 const[w,h]=vs(),bw=b[2]-b[0],bh=b[3]-b[1];
 V.s=Math.min(w/(bw*(1+2*pad)),h/(bh*(1+2*pad)));
 V.x=w/2-(b[0]+bw/2)*V.s;V.y=h/2-(b[1]+bh/2)*V.s;apply(anim);
}
function mark(m){
 const b=m.b,full=b[2]-b[0]>=1900;hl.classList.toggle("show",showHL&&!full);
 Object.assign(hl.style,{left:b[0]-8+"px",top:b[1]-8+"px",width:b[2]-b[0]+16+"px",height:b[3]-b[1]+16+"px"});
}
function go(i,anim=true){
 cur=(i+M.length)%M.length;const m=M[cur],ch=page!==m.p;
 setPage(m.p);mark(m);fitBox(m.b,anim&&!ch);
 $("#ttl").textContent=m.t;$("#dsc").textContent=m.d||"";
 $("#pick").textContent="☰ "+m.t;renderList($("#q").value);
 const on=$("#list .mi.on");on&&on.scrollIntoView({block:"nearest"});
 history.replaceState(null,"","#"+m.id);closeDrawer();
}
function zoomAt(f,cx,cy,anim){const ns=Math.min(6,Math.max(minS(),V.s*f));f=ns/V.s;V.x=cx-(cx-V.x)*f;V.y=cy-(cy-V.y)*f;V.s=ns;apply(anim)}
function center(){const[w,h]=vs();return[w/2,h/2]}
/* pointer: geser & cubit */
const P=new Map();let pd=0;
vp.addEventListener("pointerdown",e=>{vp.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);vp.classList.add("drag");hideHint();
 if(P.size===2){const[a,b]=[...P.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
vp.addEventListener("pointermove",e=>{
 if(!P.has(e.pointerId))return;const o=P.get(e.pointerId),r=vp.getBoundingClientRect();
 if(P.size===1){V.x+=e.clientX-o[0];V.y+=e.clientY-o[1];P.set(e.pointerId,[e.clientX,e.clientY]);apply(false)}
 else if(P.size===2){P.set(e.pointerId,[e.clientX,e.clientY]);const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
  if(pd){zoomAt(d/pd,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,false)}pd=d}});
const up=e=>{P.delete(e.pointerId);if(!P.size)vp.classList.remove("drag");pd=0;if(P.size===1){const k=[...P.keys()][0];}};
vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
vp.addEventListener("wheel",e=>{e.preventDefault();hideHint();const r=vp.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)),e.clientX-r.left,e.clientY-r.top,false)},{passive:false});
vp.addEventListener("dblclick",e=>{const r=vp.getBoundingClientRect();zoomAt(V.s>fitS()*1.9?.5:2,e.clientX-r.left,e.clientY-r.top,true)});
function fitS(){const b=M[cur].b,[w,h]=vs();return Math.min(w/((b[2]-b[0])*1.1),h/((b[3]-b[1])*1.1))}
vp.addEventListener("keydown",e=>{const k=e.key,st=60;
 if(k==="ArrowLeft"){V.x+=st}else if(k==="ArrowRight"){V.x-=st}else if(k==="ArrowUp"){V.y+=st}else if(k==="ArrowDown"){V.y-=st}
 else if(k==="+"||k==="="){const[c,d]=center();zoomAt(1.25,c,d,true);return}else if(k==="-"){const[c,d]=center();zoomAt(.8,c,d,true);return}
 else if(k==="0"){fitBox(M[cur].b);return}else if(k==="PageDown"){go(cur+1)}else if(k==="PageUp"){go(cur-1)}else return;
 e.preventDefault();apply(false)});
/* tombol */
const zb=f=>{const[c,d]=center();zoomAt(f,c,d,true)};
$("#zi").onclick=()=>zb(1.35);$("#zo").onclick=()=>zb(1/1.35);
$("#fit").onclick=()=>fitBox(M[cur].b);
$("#all").onclick=()=>fitBox([0,0,W,H]);
$("#prv").onclick=$("#prv2").onclick=()=>go(cur-1);$("#nxt").onclick=$("#nxt2").onclick=()=>go(cur+1);
$("#hlb").onclick=e=>{showHL=!showHL;e.currentTarget.classList.toggle("on",showHL);e.currentTarget.setAttribute("aria-pressed",showHL);mark(M[cur])};
$("#fs").onclick=()=>{const v=$("#vw");try{document.fullscreenElement?document.exitFullscreen():(v.requestFullscreen||v.webkitRequestFullscreen).call(v)}catch(e){}};
document.addEventListener("fullscreenchange",()=>setTimeout(()=>fitBox(M[cur].b,false),120));
$("#list").addEventListener("click",e=>{const b=e.target.closest(".mi");if(b)go(M.findIndex(m=>m.id===b.dataset.id))});
$("#q").addEventListener("input",e=>renderList(e.target.value));
/* drawer HP */
const side=$("#side"),bd=$("#bd");
function openDrawer(){side.classList.add("open");bd.classList.add("show")}
function closeDrawer(){side.classList.remove("open");bd.classList.remove("show")}
$("#pick").onclick=openDrawer;bd.onclick=closeDrawer;
addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
let ht;function hideHint(){$("#hint").style.opacity=0}
addEventListener("resize",()=>{clearTimeout(ht);ht=setTimeout(()=>fitBox(M[cur].b,false),150)});
addEventListener("hashchange",()=>{const i=M.findIndex(m=>m.id===location.hash.slice(1));if(i>=0&&i!==cur)go(i)});
/* mulai */
const i0=M.findIndex(m=>m.id===location.hash.slice(1));
cur=i0>=0?i0:0;
const imgs=[$("#i1"),$("#i2")];
requestAnimationFrame(()=>{go(cur,false);setTimeout(hideHint,6000)});
